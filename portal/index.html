<!DOCTYPE html>
<html lang="en">
<head>

<!--

  run code here. If a Google feature ever stops loading, the browser console names the blocked

-->
<meta http-equiv="Content-Security-Policy" content="

  font-src 'self' data:;
  img-src 'self' data: blob: https:;
  connect-src 'self' https://*.googleapis.com https://*.google.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com;
  frame-src 'self' https://*.firebaseapp.com https://*.web.app https://accounts.google.com https://docs.google.com https://drive.google.com https://*.googleusercontent.com https://content.googleapis.com https://www.google.com https://recaptcha.google.com;
  worker-src 'self' blob:;
  object-src 'none';
  base-uri 'self';
  form-action 'self' https://accounts.google.com;
">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
